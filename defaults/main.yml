---
# Tools this machine should have. Each project's bootstrap.yml sets its own list.
toolchain_tools: []

# Every tool the role knows how to install (one file per tool in tasks/tools/).
toolchain_supported:
  - postgresql-client
  - redis-cli
  - docker
  - uv
  - python3.12
  - awscli
  - localstack
  - awslocal
  - pre-commit
  - azurite

# uv: pinned installer version (same uv as the project's Dockerfile), installed per user.
toolchain_uv_version: "0.13.0"
toolchain_uv: "{{ ansible_facts['user_dir'] }}/.local/bin/uv"

# Azurite runs as a container (docker-compose.yml); the toolchain pre-pulls the SAME pinned image.
toolchain_azurite_image: "mcr.microsoft.com/azure-storage/azurite:3.37.0"

# LocalStack's CLI: lstk (replaces the deprecated `localstack` CLI and `awslocal`).
# Pinned GitHub release, unpacked into its own versioned folder, linked into ~/.local/bin.
toolchain_lstk_version: "1.4.5"
toolchain_lstk_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
toolchain_lstk_url: "https://github.com/localstack/lstk/releases/download/v{{ toolchain_lstk_version }}"
toolchain_lstk_dir: "{{ ansible_facts['user_dir'] }}/.local/share/lstk/{{ toolchain_lstk_version }}"

# Verify: one command per tool. It must exit 0 and print something (its version) if the tool works.
# Full paths for user-level tools: ~/.local/bin may not be on Ansible's PATH yet on a fresh machine.
toolchain_bin: "{{ ansible_facts['user_dir'] }}/.local/bin"
# Checks that talk to the Docker daemon. They run as root: right after the role adds the user to
# the docker group, that membership only works after the next login (lstk aws checks Docker first).
toolchain_verify_as_root: [azurite, awslocal]
toolchain_verify:
  postgresql-client: "psql --version"
  redis-cli: "redis-cli --version"
  docker: "d=$(docker --version) && c=$(docker compose version) && echo \"$d; $c\""
  uv: "{{ toolchain_uv }} --version"
  python3.12: "\"$({{ toolchain_uv }} python find 3.12)\" --version"
  awscli: "aws --version"
  localstack: "{{ toolchain_bin }}/lstk --version"
  awslocal: "{{ toolchain_bin }}/lstk aws --version | grep aws-cli/"
  pre-commit: "{{ toolchain_bin }}/pre-commit --version"
  azurite: "docker image ls --quiet {{ toolchain_azurite_image }} | grep -q . && echo {{ toolchain_azurite_image }}"
