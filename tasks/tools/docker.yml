---
- name: "docker | check for Docker with the Compose v2 plugin"
  ansible.builtin.command: docker compose version
  register: toolchain_docker_compose
  changed_when: false
  failed_when: false

- name: "docker | install Docker Engine and Compose v2 (Ubuntu packages)"
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: toolchain_docker_compose.rc != 0

- name: "docker | let {{ ansible_facts['user_id'] }} run docker without sudo"
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
  become: true
  register: toolchain_docker_group

# register keeps only the LAST run, and this file runs again via azurite. set_fact with a
# `when` only ever SETS the flag, so a later "ok" run can't clear it.
- name: docker | remember that the user was just added to the docker group
  ansible.builtin.set_fact:
    toolchain_docker_group_added: true
  when: toolchain_docker_group is changed
