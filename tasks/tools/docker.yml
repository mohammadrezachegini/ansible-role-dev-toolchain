---
- name: "docker | check for Docker with the Compose v2 plugin"
  ansible.builtin.command: docker compose version
  register: toolchain_docker_compose
  changed_when: false
  failed_when: false

- name: "docker | install Docker Engine and Compose v2 (Ubuntu packages)"
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: toolchain_docker_compose.rc != 0

- name: "docker | let {{ ansible_facts['user_id'] }} run docker without sudo"
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
  become: true
