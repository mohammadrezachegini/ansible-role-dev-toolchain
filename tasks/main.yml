---
- name: Check the operating system is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == "Ubuntu"
    fail_msg: "dev-toolchain supports Ubuntu only (found {{ ansible_facts['distribution'] }})"
    quiet: true

- name: Check every requested tool is known
  ansible.builtin.assert:
    that:
      - toolchain_tools | difference(toolchain_supported) | length == 0
    fail_msg: "Unknown tool(s): {{ toolchain_tools | difference(toolchain_supported) | join(', ') }}. Supported: {{ toolchain_supported | join(', ') }}"
    quiet: true

- name: Install each requested tool
  ansible.builtin.include_tasks: "tools/{{ tool }}.yml"
  loop: "{{ toolchain_tools }}"
  loop_control:
    loop_var: tool

- name: Verify every requested tool
  ansible.builtin.import_tasks: verify.yml
  tags: [verify]
